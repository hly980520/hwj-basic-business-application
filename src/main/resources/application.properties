##nacos配置中心
nacos.config.server-addr=127.0.0.1:8848
nacos.config.namespace=hwj-business-config
nacos.config.username=nacos
nacos.config.password=nacos

###Redis Config###
##集群模式配置 spring.redis.cluster.nodes=127.0.0.1:6379,127.0.0.1:6380##
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.timeout=2000
##使用jedis连接池
spring.redis.jedis.pool.min-idle=4
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.max-active=16
spring.redis.jedis.pool.max-wait=5000

#### xxl-job config
### xxl-job admin address list
hwj.xxl-job.executor.addresses=http://127.0.0.1:8088/xxl-job-admin
### xxl-job executor address
hwj.xxl-job.executor.app-name=hwj-basic-business-executor
hwj.xxl-job.executor.ip=
hwj.xxl-job.executor.port=9999
### xxl-job, access token
hwj.xxl-job.executor.access-token=
### xxl-job log path
hwj.xxl-job.executor.log-path=/logs/xxl-job/jobhandler
### xxl-job log retention days
hwj.xxl-job.executor.log-retention-days=30

